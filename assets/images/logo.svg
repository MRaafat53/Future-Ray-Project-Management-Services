<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="50" height="50">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#1A3C5E"/>
  <!-- Rays (6 rays) -->
  <g fill="#F5A623">
    <!-- Top -->
    <polygon points="100,10 108,45 92,45"/>
    <!-- Top-right -->
    <polygon points="167,33 143,62 127,46"/>
    <!-- Bottom-right -->
    <polygon points="190,100 155,108 155,92"/>
    <!-- Bottom -->
    <polygon points="167,167 138,143 154,127"/>
    <!-- Bottom-left -->
    <polygon points="100,190 92,155 108,155"/>
    <!-- Top-left -->
    <polygon points="33,167 57,138 73,154"/>
    <!-- Left -->
    <polygon points="10,100 45,92 45,108"/>
    <!-- Top-left ray -->
    <polygon points="33,33 62,57 46,73"/>
  </g>
  <!-- Central circle inner glow -->
  <circle cx="100" cy="100" r="38" fill="#1A3C5E"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#F5A623" stroke-width="3" opacity="0.5"/>
  <!-- Center star/sun core -->
  <circle cx="100" cy="100" r="22" fill="#F5A623"/>
  <circle cx="100" cy="100" r="14" fill="#1A3C5E"/>
  <circle cx="100" cy="100" r="8"  fill="#00B4D8"/>
</svg>
